# Render Blueprint — deploys the FastAPI backend and a free Redis-compatible
# Key Value store. The frontend is deployed separately on Vercel (not here)
# — Render's own static-site hosting was tried first and dropped in favor
# of Vercel. Postgres is deliberately NOT defined here either: Render's free
# Postgres wipes all data 30 days after creation, which is unacceptable for
# real campaign/account data. Use a free Neon (neon.tech) Postgres instead —
# paste its UNPOOLED connection string into DATABASE_URL below, rewritten to
# postgresql+asyncpg://...?ssl=require (see backend/.env.example for why).
services:
  - type: web
    name: phishguard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio   # close to Neon's us-east-2 — minimizes DB round-trip latency
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in the Render dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: phishguard-kv
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MAILJET_API_KEY
        sync: false   # Mailjet → Account Settings → API Key Management
      - key: MAILJET_API_SECRET
        sync: false
      - key: MAILJET_SENDER_EMAIL
        sync: false   # must be a sender verified in Mailjet → Sender addresses
      - key: FRONTEND_URL
        sync: false   # your Vercel URL(s), comma-separated
      - key: BASE_URL
        sync: false   # this service's own public URL, filled in after first deploy
      - key: ENVIRONMENT
        value: production
      - key: PRIMARY_MODEL
        value: allam-2-7b
      - key: FALLBACK_MODEL
        value: gpt-4o
      - key: RAGAS_PASS_THRESHOLD
        value: 0.75
      - key: MAX_RETRIES
        value: 2
      - key: EMAIL_DAILY_LIMIT
        value: 450
      - key: TRACKING_WINDOW_DAYS
        value: 14

  - type: keyvalue
    name: phishguard-kv
    plan: free
    region: ohio
    ipAllowList: []
